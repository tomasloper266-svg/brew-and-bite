<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Brew &amp; Bite — برو آند بايت</title>
  <meta name="description" content="Brew & Bite — كافيه • كيتشين • لاونج في حمص، سوريا. اطلب أونلاين — الدفع كاش عند الاستلام.">
  <meta name="theme-color" content="#f7f1e6">
  <script>
    /* Apply saved language before first paint to avoid direction flash */
    try {
      var l = localStorage.getItem('bb_lang') || 'ar';
      document.documentElement.lang = l;
      document.documentElement.dir = (l === 'ar') ? 'rtl' : 'ltr';
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Aref+Ruqaa:wght@400;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23e0701f'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='28' font-weight='700' text-anchor='middle' fill='%23fffaf1'%3EB%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar" aria-label="Brew &amp; Bite"></header>
    <main id="view" tabindex="-1"></main>
    <footer id="foot"></footer>
  </div>

  <a id="cartFab" href="#/cart" hidden aria-label="السلة">
    <span class="fab-icon"></span>
    <span id="fabBadge" class="fab-badge" hidden>0</span>
  </a>

  <div id="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
